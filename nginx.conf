server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;                     # no IP logging

    # Strict CSP (see security-headers.conf): same-origin scripts only, every one carrying a Subresource Integrity hash,
    # no third-party hosts, nothing can be sent anywhere except back to this origin.
    location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location ~* \.(js|css|svg)$ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store" always; try_files $uri $uri/ /index.html; }
}
