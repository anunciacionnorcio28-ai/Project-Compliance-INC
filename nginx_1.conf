worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Privacy: no access log at all, no version banner, no client IP forwarded upstream.
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 6m;
    client_body_timeout 15s;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=30r/m;   # shared-memory counter only, never written to disk

    # Plain HTTP only redirects to HTTPS.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Public entry point: TLS 1.3 only + HSTS.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        include /etc/nginx/locations.conf;
    }

    # Tor-ready: the onion service (docker compose --profile tor) forwards to this plain-HTTP listener.
    # It is only reachable on the internal edge network and is never published to the host.
    server {
        listen 8080;
        server_name _;
        include /etc/nginx/locations.conf;
    }
}
