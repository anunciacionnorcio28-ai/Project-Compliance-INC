server:
  port: 8080
  forward-headers-strategy: none        # never trust/record client IPs
  tomcat:
    accesslog:
      enabled: false                     # no IP logging
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: privmicro
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/privmicro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:privmicro}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none                     # schema comes from docker/mysql/init (encrypted tables)
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
logging:
  level:
    root: WARN
    app.privmicro: INFO
app:
  jwt-secret: ${JWT_SECRET}                      # >= 32 random chars
  data-encryption-key: ${DATA_ENCRYPTION_KEY}    # base64 of 32 random bytes (AES-256-GCM for MFA secrets)
  cookie-secure: ${COOKIE_SECURE:true}
  session-minutes: ${SESSION_MINUTES:120}
  cleanup-interval-ms: ${CLEANUP_INTERVAL_MS:60000}
